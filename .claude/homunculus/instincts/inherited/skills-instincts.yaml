# Skills Workflow Update Documentation Files

## Action

Follow the update-documentation-files workflow:
1. Edit or add content to README.md at the root or within a skill directory
2. Optionally update or add language-specific README files (e.g., README.zh-CN.md)
3. Update CHANGELOG.md and/or SKILL.md as needed
4. Commit changes with a docs-related message

## Evidence

- Workflow detected from commit patterns
- Frequency: ~3x per month
- Files: README.md, codex-cross-provider-session-repair/README.md, codex-cross-provider-session-repair/README.zh-CN.md

