# Skills Workflow Add Or Enhance Skill Package

## Action

Follow the add-or-enhance-skill-package workflow:
1. Create or update the skill directory with necessary files (README, SKILL.md, scripts, tests, etc.)
2. Add or update scripts (e.g., install.sh, package.py, repair.py)
3. Update or add tests in the tests/ subdirectory
4. Update documentation files within the skill (README.md, CHANGELOG.md, SKILL.md, etc.)
5. Commit all changes together

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: codex-cross-provider-session-repair/README.md, codex-cross-provider-session-repair/SKILL.md, codex-cross-provider-session-repair/CHANGELOG.md

