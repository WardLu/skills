name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator and skill test dependencies
        run: python -m pip install --disable-pip-version-check "PyYAML>=6.0,<7"
      - name: Validate skill metadata
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          validator = pathlib.Path.home() / '.agents' / 'skills' / 'skill-creator' / 'scripts' / 'quick_validate.py'
          roots = sorted(path.parent for path in pathlib.Path('.').glob('*/SKILL.md'))
          assert roots, 'no skill directories found'
          for root in roots:
              if validator.exists():
                  subprocess.check_call([sys.executable, str(validator), str(root)])
              else:
                  text = (root / 'SKILL.md').read_text(encoding='utf-8')
                  assert text.startswith('---\n') and '\nname:' in text and '\ndescription:' in text
          PY
      - name: Validate release checklist contract
        run: |
          python - <<'PY'
          import pathlib
          import re

          path = pathlib.Path('docs/release-checklist.md')
          assert path.is_file(), 'missing docs/release-checklist.md'
          text = path.read_text(encoding='utf-8')
          required = [
              '## 1. Scope, version, and release inputs',
              '## 2. Code, tests, and build artifacts',
              '## 3. Database migrations',
              '## 4. Functions and data repair',
              '## 5. Configuration and CDN',
              '## 6. Preview',
              '## 7. Production',
              '## 8. Rollback and recovery',
              '## 9. Evidence and final decision',
          ]
          positions = [text.index(heading) for heading in required]
          assert positions == sorted(positions), 'release checklist sections are out of order'
          start = text.index('## 1. Scope, version, and release inputs')
          end = text.index('## Notes')
          section_text = text[start:end]
          items = [line for line in section_text.splitlines() if line.startswith('- ')]
          assert items, 'release checklist has no checklist items'
          allowed = re.compile(r'^- .+ Status: `(completed|N/A|blocked)` — .+$')
          invalid = [line for line in items if not allowed.match(line)]
          assert not invalid, 'invalid or missing release checklist status line(s): ' + repr(invalid)
          assert '`pending`' in text and '`skipped`' in text, 'status contract must reject legacy states'
          PY
      - name: Run offline tests
        run: |
          for tests in */tests; do
            python -m unittest discover -s "$tests" -v
          done
